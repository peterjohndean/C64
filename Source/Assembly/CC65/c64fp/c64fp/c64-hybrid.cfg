# ---------------------------------------------------------------------------
# C64 Hybrid C/Assembly Linker Configuration
# ---------------------------------------------------------------------------

SYMBOLS {
    # Define the C runtime software stack size. 
    # This is for C local variables, NOT the 6502 hardware stack at $0100.
    __STACKSIZE__: type = weak, value = $0800; # 2KB stack
}

MEMORY {
    # Zero-page reserved for cc65 pseudo-registers (pointers, 16/32-bit math).
    # $0002-$001A is standard as it avoids clobbering Kernal/BASIC ZP vectors.
    ZP:       file = "", define = yes, start = $0002, size = $001A;

    # The two-byte load address ($0801) required for C64 PRG files.
    LOADADDR: file = %O,               start = $07FF, size = $0002;

    # The BASIC SYS line (e.g., "10 SYS 2062")
    HEADER:   file = %O, define = yes, start = $0801, size = $000D;

    # Main RAM starting immediately after the BASIC stub ($080E).
    # Capped at $CFFF to protect I/O space at $D000. 
    # The software stack is carved out of the top of this MAIN block.
    MAIN:     file = %O, define = yes, start = $080E, size = $C7F2 - __STACKSIZE__;
}

SEGMENTS {
    # File headers
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;

    # STARTUP contains the C runtime initialization code (crt0).
    # It MUST be the very first thing in MAIN so the BASIC SYS line hits it.
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;

    # Main application segments
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro; # Read-only data (printf strings, lookup tables)
    DATA:     load = MAIN,     type = rw; # Initialized variables (e.g., int x = 5;)
    INIT:     load = MAIN,     type = rw,  optional = yes;

    # BSS contains uninitialized variables (e.g., int x; or large buffers).
    # Type 'bss' means it takes ZERO space in the PRG file on disk; 
    # the C runtime clears this memory space to $00 on startup.
    BSS:      load = MAIN,     type = bss, define   = yes;

    # ZEROPAGE mapped to the ZP memory block defined above.
    ZEROPAGE: load = ZP,       type = zp,  define   = yes;
}

# The C runtime uses these tables to initialize the environment.
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = INIT;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
