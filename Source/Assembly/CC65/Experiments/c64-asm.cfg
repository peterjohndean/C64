# ---------------------------------------------------------------------------
# c64-asm.cfg
# Custom linker script for pure 6502 assembly projects.
# ---------------------------------------------------------------------------
FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__: type = import;
}
MEMORY {
    ZP:       file = "", start = $0002,  size = $00FE,      define = yes;
    LOADADDR: file = %O, start = %S - 2, size = $0002;
    MAIN:     file = %O, start = %S,     size = $D000 - %S;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp,  optional = yes;

    # LOADADDR must go first to create the PRG header
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN,     type = ro,  optional = yes;

    # STARTUP contains our BASIC stub
    STARTUP:  load = MAIN,     type = ro;

    # INIT strictly holds the main entry point to catch the SYS call
    INIT:     load = MAIN,     type = ro,  optional = yes;

    # CODE contains all the main logic and library routines
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro,  optional = yes;

    # DATA is for pre-initialized variables and text strings
    DATA:     load = MAIN,     type = rw,  optional = yes;

    # BSS is for uninitialized RAM (e.g., .res 256)
    BSS:      load = MAIN,     type = bss, optional = yes, define = yes;
}
